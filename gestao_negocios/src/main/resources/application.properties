spring.application.name=gestao_negocios

# O banco será salvo em um arquivo na pasta "dados" dentro do diretório do seu sistema
spring.datasource.url=jdbc:h2:file:./dados/posdb;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=none

# Console web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console