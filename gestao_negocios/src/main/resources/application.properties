spring.application.name=gestao_negocios


# O banco será salvo em um arquivo na pasta "dados" dentro do diretório do seu sistema
spring.datasource.url=jdbc:h2:file:./dados/posdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativa o console web em produção se quiser mais segurança
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console